name: Comprobaciones

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Revisar JavaScript
        run: node scripts/check-js.js
      - name: Pruebas y traducciones
        run: |
          node tests/sw/sw.test.js
          node tests/demo/demo.test.js
          node tests/plugins/migration.test.js
          node tests/consent/consent.test.js
          node tests/settings/settings.test.js
          node tests/vault/vault.test.js
          node tests/vault/team-vault.test.js
          node tests/crypto/project-crypto.test.js
          node tests/crypto/keystore.test.js
          node tests/crypto/schema-rules.test.js
          node tests/crypto/collection-model.test.js
          node tests/crypto/encrypted-models.test.js
          node tests/crypto/backup-clients.test.js
          node tests/crypto/team-sharing.test.js
          node tests/crypto/key-rotation.test.js
          node tests/crypto/project-convert.test.js
          node tests/backup/backup.test.js
          node tests/assets/limits.test.js
          node tests/build/bundle.test.js
          node tests/season/season.test.js
          node tests/worker/rate-limit.test.js
          node tests/worker/kms.test.js
          node tests/worker/domains.test.js
          node tests/e2e/hreflang-check.js
          node tests/e2e/sitemap-check.js
          node tests/e2e/seo-check.js
          node scripts/check-i18n.js --strict
      - name: Compilar versión pública
        run: node scripts/build-public.js

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar emulador y pruebas
        run: npm ci --prefix tests/rules --no-audit --no-fund
      - name: Probar reglas de Firestore
        run: npm test --prefix tests/rules

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Playwright
        run: npm ci --prefix tests/e2e --no-audit --no-fund
      - name: Instalar Chromium
        run: npx --prefix tests/e2e playwright install --with-deps chromium
      - name: Recorridos de navegador
        run: npm test --prefix tests/e2e
      - name: Almacén de claves en el navegador
        run: node tests/e2e/keystore-check.js
      - name: Instalar emuladores de Firebase
        run: npm ci --prefix tests/rules --no-audit --no-fund
      - name: Alta y cofre con Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/cloud-smoke.js"
      - name: Proyecto con cifrado total en Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/crypto-smoke.js"
      - name: Equipo con cifrado total en Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/crypto-team.js"
      - name: Contraseñas compartidas de un equipo en Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/team-vault.js"
      - name: Cambio de clave de un proyecto cifrado en Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/crypto-rotate.js"
      - name: Convertir un proyecto a cifrado total en Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/crypto-convert.js"
      - name: Proyecto gestionado por Kanlane en Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/crypto-managed.js"
      - name: Asistente de cifrado total en Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/crypto-wizard.js"
