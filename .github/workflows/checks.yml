name: Comprobaciones

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Revisar JavaScript
        run: node scripts/check-js.js
      - name: Pruebas y traducciones
        run: |
          node tests/sw/sw.test.js
          node tests/demo/demo.test.js
          node tests/plugins/migration.test.js
          node tests/guest/guest-migration.test.js
          node tests/auth/access-failure.test.js
          node tests/consent/consent.test.js
          node tests/settings/settings.test.js
          node tests/i18n/stages.test.js
          node tests/vault/vault.test.js
          node tests/vault/team-vault.test.js
          node tests/vault/vault-totp.test.js
          node tests/vault/qr.test.js
          node tests/crypto/project-crypto.test.js
          node tests/crypto/keystore.test.js
          node tests/crypto/schema-rules.test.js
          node tests/crypto/collection-model.test.js
          node tests/crypto/encrypted-models.test.js
          node tests/crypto/backup-clients.test.js
          node tests/crypto/team-sharing.test.js
          node tests/crypto/key-rotation.test.js
          node tests/crypto/project-convert.test.js
          node tests/backup/backup.test.js
          node tests/fields/custom-fields.test.js
          node tests/tasks/cover.test.js
          node tests/tasks/relations.test.js
          node tests/tasks/votes.test.js
          node tests/tasks/subtasks.test.js
          node tests/tasks/repeat.test.js
          node tests/tasks/archive.test.js
          node tests/tasks/duplicate.test.js
          node tests/tasks/filter.test.js
          node tests/tasks/sort.test.js
          node tests/local/local-store.test.js
          node tests/trello/trello-import.test.js
          node tests/assets/limits.test.js
          node tests/markdown/markdown.test.js
          node tests/automations/automations.test.js
          node tests/build/bundle.test.js
          node tests/build/minify.test.js
          node tests/build/headers.test.js
          node tests/season/season.test.js
          node tests/worker/rate-limit.test.js
          node tests/worker/kms.test.js
          node tests/worker/automations.test.js
          node tests/worker/mime.test.js
          node tests/worker/capture.test.js
          node tests/worker/mcp.test.js
          node tests/worker/webpush.test.js
          node tests/worker/notify.test.js
          node tests/tasks/mentions.test.js
          node tests/worker/totp.test.js
          node tests/worker/domains.test.js
          node tests/e2e/hreflang-check.js
          node tests/e2e/sitemap-check.js
          node tests/e2e/seo-check.js
          node scripts/check-i18n.js --strict
      - name: Compilar versión pública
        run: node scripts/build-public.js

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar emulador y pruebas
        run: npm ci --prefix tests/rules --no-audit --no-fund
      - name: Probar reglas de Firestore
        run: npm test --prefix tests/rules

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Playwright
        run: npm ci --prefix tests/e2e --no-audit --no-fund
      - name: Instalar Chromium
        run: npx --prefix tests/e2e playwright install --with-deps chromium
      - name: Recorridos de navegador
        run: npm test --prefix tests/e2e
      - name: Almacén de claves en el navegador
        run: node tests/e2e/keystore-check.js
      - name: Contraseñas y portapapeles
        run: node tests/e2e/vault-clipboard.js
      - name: Aviso antes de sincronizar con GitHub
        run: node tests/e2e/github-consent.js
      - name: Smart GP, horas por subtarea
        run: node tests/e2e/smartgp.js
      - name: Instalar emuladores de Firebase
        run: npm ci --prefix tests/rules --no-audit --no-fund
      - name: Alta y cofre con Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/cloud-smoke.js"
      - name: Nombre, foto, contraseña y eliminación de la cuenta, con Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/account.js"
      - name: Un invitado crea su cuenta y se lleva sus datos, con Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/guest-migrate.js"
      - name: Proyecto con cifrado total en Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/crypto-smoke.js"
      - name: Equipo con cifrado total en Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/crypto-team.js"
      - name: Automatizaciones por fecha en el servidor con Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/automation-cron.js"
      - name: Automatizaciones de un equipo (propietaria y editor) con Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/automation-team.js"
      - name: Captura de tareas por correo con Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/mail-capture.js"
      - name: Importar una copia de seguridad en Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/backup-import.js"
      - name: Servidor MCP con Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/mcp.js"
      - name: Tokens del servidor MCP en Ajustes con Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/mcp-settings.js"
      - name: Contraseñas compartidas de un equipo en Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/team-vault.js"
      - name: Cambio de clave de un proyecto cifrado en Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/crypto-rotate.js"
      - name: Convertir un proyecto a cifrado total en Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/crypto-convert.js"
      - name: Proyecto gestionado por Kanlane en Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/crypto-managed.js"
      - name: Asistente de cifrado total en Firebase emulado
        run: npx --prefix tests/rules firebase emulators:exec --only auth,firestore --project demo-workhub --config firebase.test.json "node tests/e2e/crypto-wizard.js"
