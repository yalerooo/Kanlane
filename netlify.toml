# Publicación en Netlify (guía: docs/NETLIFY.md).
#
# Se publica SOLO dist/, que scripts/build-public.js rellena con index.html,
# assets/ y src/: data-backup.json y el resto de archivos de la carpeta nunca
# se publican.

[build]
  command = "node scripts/build-public.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Inicio de sesión con Firebase desde este mismo dominio: Netlify reenvía las
# páginas de acceso de Firebase (/__/auth/…) sin cambiar la dirección, y la app
# usa este dominio como authDomain (hostingDomains en firebase-config.js).
[[redirects]]
  from = "/__/auth/*"
  to = "https://workhub-26f50.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://workhub-26f50.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true

# Cabeceras de seguridad para todo el sitio.
# Netlify ya revalida los archivos en cada visita, así que los cambios se ven al recargar.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Solo la página de la app (no /__/auth/*, que es de Firebase y tiene sus
# propias reglas: debe poder abrirse en ventana y en un marco oculto).
#   - frame-ancestors / X-Frame-Options: ninguna otra web puede meter Workhub
#     en un marco para engañarte con clics.
#   - script-src: solo scripts de este dominio y del SDK de Firebase/Google;
#     ningún script en línea ni eval, así una inyección de HTML no ejecuta nada.
#   - connect-src: la app solo habla con los servicios de Google/Firebase.
#   - frame-src https:: los plugins de terceros se cargan en un <iframe
#     sandbox> desde su propio dominio (aislados: ver src/services/plugin-host.js).
# Si añades otro servicio externo, añade su dominio aquí.
[[headers]]
  for = "/"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; connect-src 'self' https://*.googleapis.com https://apis.google.com; frame-src 'self' https: http://localhost:* http://127.0.0.1:*; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/index.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; connect-src 'self' https://*.googleapis.com https://apis.google.com; frame-src 'self' https: http://localhost:* http://127.0.0.1:*; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
